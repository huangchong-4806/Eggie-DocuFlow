name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装测试依赖
        run: |
          pip install openpyxl==3.1.5 pdfplumber==0.11.8 pypdf==6.10.0 \
                      Pillow==12.2.0 pypdfium2==5.10.1 \
                      PySide6-Essentials==6.10.3 \
                      alibabacloud_ocr_api20210707==3.1.3

      - name: 运行所有测试
        run: python -m unittest discover -s tests -v

  build-windows:
    name: Windows 安装包
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装项目依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 Windows 测试
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -v

      - name: 生成 Windows 安装包
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: 实际安装并验证运行
        shell: pwsh
        run: |
          $version = python main.py --version
          $installer = Resolve-Path "release\EggieDocuFlow_V${version}_Windows_x64_Setup.exe"
          $install = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($install.ExitCode -ne 0) { throw "Windows 安装失败，退出码：$($install.ExitCode)" }
          $application = "$env:ProgramFiles\Eggie DocuFlow\Eggie DocuFlow.exe"
          if (-not (Test-Path $application)) { throw "安装后未找到软件：$application" }
          $installed = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "Eggie DocuFlow" |
            Select-Object -First 1
          if ($installed.DisplayVersion -ne $version) { throw "安装版本不正确：$($installed.DisplayVersion)" }
          $run = Start-Process -PassThru -FilePath $application
          Start-Sleep -Seconds 5
          if ($run.HasExited) { throw "Windows 软件启动后意外退出，退出码：$($run.ExitCode)" }
          Stop-Process -Id $run.Id -Force
          Get-FileHash -Algorithm SHA256 $installer

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: EggieDocuFlow_V1.4.0_Windows_x64_Setup
          path: release/EggieDocuFlow_V1.4.0_Windows_x64_Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
